services:
  notebook:
    build: .
    image: msml-experiment:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace
    command: ["python", "tools/execute_notebook.py"]
  preprocess:
    image: msml-experiment:local
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace
    command: ["python", "preprocessing/automate_DaudHidayatRamadhan.py"]
