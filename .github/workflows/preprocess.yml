name: Verified preprocessing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sqli_xss_raw/**'
      - 'preprocessing/automate_*.py'
      - 'preprocessing/Eksperimen_*.ipynb'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'tests/**'
      - '.github/workflows/preprocess.yml'
permissions:
  contents: read
concurrency:
  group: preprocessing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Docker environment
        run: docker build -t msml-experiment:ci .
      - name: Regenerate dataset from frozen raw source
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" msml-experiment:ci python preprocessing/automate_DaudHidayatRamadhan.py
      - name: Verify manual parity and quality invariants
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" msml-experiment:ci python -m unittest discover -s tests
      - name: Preserve processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: sqli-xss-preprocessed-${{ github.sha }}
          path: preprocessing/sqli_xss_preprocessing/
          if-no-files-found: error
          retention-days: 30
      - name: Commit regenerated data if changed
        run: |
          git add preprocessing/sqli_xss_preprocessing/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified processed dataset'
            git push
          fi
